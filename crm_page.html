<script>
const ST={people:{},payments:{},rake:{},rooms:{},tasks:{},expenses:{}};
const loaded=new Set();
let db=null, tab='dash';
const STAGES=[['new','Новый'],['talk','В диалоге'],['think','Думает'],['won_club','Оплатил клуб'],['won_eqrb','Играет по сделке'],['lost','Отказ']];
const TAGS=[['lead','Лид'],['club','Клуб'],['student','Ученик'],['eqrb','EQRB']];
const ACCESS=[['none','Нет доступа'],['paid','Подписка'],['eqrb','Бесплатно (EQRB)'],['og','OG']];
const SOURCES=['','Telegram-блог','Instagram','HH-сервер','Discord','Сайт','Рекомендация','Другое'];
const INTEREST=[['club','Клуб'],['eqrb','EQRB'],['both','Клуб + EQRB']];
const ABI=['','abi5','abi10','abi30','abi50','abi100','abi200+'];
const METHODS=['USDT TRC20','Перевод в руме','Другое'];
const EXTRA_ROOMS=['GGPoker','Winamax','PokerStars','PokerOK','Chico','iPoker','WPN','CoinPoker'];
const PRICE=349, DISC={1:0,3:.10,6:.17,12:.25};
const MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoD(new Date());
const curMonth=()=>today().slice(0,7);
function prevMonth(){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1+n,d);if(dt.getDate()!==d)dt.setDate(0);return isoD(dt)}
const days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const fmtD=s=>s?s.split('-').reverse().join('.'):'—';
const fmtM=s=>{if(!s)return '—';const [y,m]=s.split('-');const n=MN[+m-1]||m;return n[0].toUpperCase()+n.slice(1)+' '+y};
const money=n=>{const v=Math.round((+n||0)*100)/100;return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- derived ---------- */
function clubState(p){const c=p.club||{};if(!tagsOf(p).includes('club')||!c.access||c.access==='none')return null;
  if(c.access!=='paid')return {key:'free',cls:'acc',label:ACCESS.find(a=>a[0]===c.access)[1]};
  if(!c.until)return {key:'nodate',cls:'warn',label:'Нет даты окончания'};
  const left=days(today(),c.until);
  if(left<0)return {key:'bad',cls:'bad',label:'Просрочено '+(-left)+' дн',left};
  if(left<=7)return {key:'warn',cls:'warn',label:left===0?'Заканчивается сегодня':'Продление через '+left+' дн',left};
  return {key:'ok',cls:'ok',label:'Активна до '+fmtD(c.until),left}}
/* Минус игрока (отрицательный рейк за месяц) отыгрывается его следующим рейком по тому же руму:
   пока минус не закрыт, рейкбек игроку не начисляется — только с рейка сверх минуса. carryCredit — рейк, зачтённый в минус деньгами. */
let CARRY={m:new Map(),rem:{}};
function computeCarry(){const m=new Map(),rem={},by={};Object.values(ST.rake).forEach(r=>{const k=r.personId+'|'+r.room;(by[k]=by[k]||[]).push(r)});
  for(const [k,rs] of Object.entries(by)){rs.sort((a,b)=>(a.month||'').localeCompare(b.month||'')||(a.createdAt||'').localeCompare(b.createdAt||''));
    let pool=rs.reduce((s,r)=>s+(+r.carryCredit||0),0),c=0;
    for(const r of rs){const rk=+r.rake||0;const pp=+(r.payout??(ST.rooms[r.room]||{}).payout??0);if(rk<0&&pp>0){const add=-rk,use=Math.min(pool,add);pool-=use;c+=add-use;m.set(r,{minus:true});continue}
      else if(c>0.004&&rk>0){const cov=Math.min(rk,c);c-=cov;m.set(r,{covered:cov})}}
    if(c>0.004)rem[k]=c}
  CARRY={m,rem}}
const remOf=pid=>Object.entries(CARRY.rem).filter(([k])=>k.split('|')[0]===pid).reduce((s,[,v])=>s+v,0);
function rcalc(r){const room=ST.rooms[r.room]||{};const deal=r.deal??room.deal??0,pay=r.payout??room.payout??0;const rk=+r.rake||0;const cm=CARRY.m.get(r)||{};
  const base=cm.minus?0:rk-(cm.covered||0);const inc=rk*deal/100;const out=r.outFixed!=null&&r.outFixed!==''?+r.outFixed:base*pay/100;
  const rf=ST.people[r.personId]?.ref;const refPid=rf&&rf.pid&&+rf.pct&&ST.people[rf.pid]&&(!rf.since||r.month>=rf.since)?rf.pid:null;const ref=refPid?base*(+rf.pct)/100:0;
  return {deal,pay,inc,out,ref,refPid,refPct:refPid?+rf.pct:0,margin:inc-out-ref,minus:!!cm.minus,covered:cm.covered||0}}
function roomName(id){if(!id)return '—';if(id.startsWith('x:'))return id.slice(2);return ST.rooms[id]?.name||'Удалённый рум'}
function roomOpts(sel,onlyDeal){const rs=Object.entries(ST.rooms).filter(([,r])=>r.active!==false||r===ST.rooms[sel]).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||''));
  let h=rs.map(([id,r])=>`<option value="${esc(id)}"${id===sel?' selected':''}>${esc(r.name)} · ${r.deal??0}/${r.payout??0}</option>`).join('');
  if(!onlyDeal)h+=EXTRA_ROOMS.map(n=>{const v='x:'+n;return `<option value="${esc(v)}"${v===sel?' selected':''}>${esc(n)} · без сделки</option>`}).join('');return h}
function dueLeads(){const t=today();return Object.entries(ST.people).filter(([,p])=>tagsOf(p).includes('lead')&&p.lead?.nextDate&&p.lead.nextDate<=t&&!['won_club','won_eqrb','lost'].includes(p.lead?.stage))}
function unpaidGroups(){const g={};const add=(pid,m,v)=>{const k=pid+'|'+m;(g[k]=g[k]||{pid,month:m,sum:0}).sum+=v};Object.values(ST.rake).forEach(r=>{const c=rcalc(r);if(!r.paid)add(r.personId,r.month,c.out);if(c.refPid&&!r.refPaid)add(c.refPid,r.month,c.ref)});return Object.values(g).filter(x=>x.sum>0).sort((a,b)=>a.month.localeCompare(b.month))}

    ${tile('Долг партнёров',money(debt),debt?'ждём выплат по сделкам':'долгов нет',debt?'bad':'')}
  </div><div class="grid2">

function dashAff(){const months=[...new Set(Object.values(ST.rake).map(r=>r.month))].sort().reverse();if(!months.length)return '';

  Object.values(ST.rake).forEach(r=>{if(!inP(r.month))return;const c=rcalc(r);const nr=r.partnerUnpaid?c.inc:0;const pay=c.out+c.ref;
    const x=g[r.personId]=g[r.personId]||{rk:0,inc:0,nr:0,out:0,nicks:new Set()};x.rk+=+r.rake||0;x.inc+=c.inc;x.nr+=nr;x.out+=pay;if(r.nick)x.nicks.add(r.nick.replace(' · доплата',''));
    W.rk+=+r.rake||0;W.inc+=c.inc;W.nr+=nr;W.out+=pay;if(ST.people[r.personId]?.own){W.ownInc+=c.inc;W.ownNr+=nr}});

  const got=W.inc-W.nr,net=got-W.out-EX,full=W.inc-W.out-EX;

async function saveDraft(close){if(!(draft.name||'').trim()){toast('Укажи имя');document.getElementById('f-name')?.focus();return false}
  draft.name=draft.name.trim();draft.accounts=(draft.accounts||[]).filter(a=>a.room||a.nick);draft.updatedAt=today();
  if(draft.student?.plan)draft.student.plan=draft.student.plan.filter(x=>x.month||x.goal);
  const ok=await put('people',editId,clone(draft));if(ok){dirty=false;if(close){closeModal(true);toast('Сохранено')}else renderModal()}return ok}

async function addPay(){const P=ui.pay;if(!(+P.amount>0)){toast('Укажи сумму');return}if(!P.date){toast('Укажи дату');return}
  draft.club=draft.club||{};const c=draft.club;const base=c.until&&c.until>=P.date?c.until:P.date;
  c.until=addMonths(base,+P.months);if(!c.since)c.since=P.date;c.access='paid';if(!c.price)c.price=PRICE;if(!draft.tags.includes('club'))draft.tags.push('club');
  if(!await saveDraft(false))return;
  if(await put('payments',uid(),{personId:editId,date:P.date,amount:+P.amount,months:+P.months,method:P.method,txid:(P.txid||'').trim()})){toast('Оплата внесена. Доступ до '+fmtD(c.until));resetPay();renderModal()}}

async function addRake(){const rf=ui.rf;if(!rf.pid||!rf.room||rf.rake===''){toast('Выбери игрока, рум и впиши рейк');return}
  const p=ST.people[rf.pid],room=ST.rooms[rf.room];const acc=(p.accounts||[]).find(a=>a.room===rf.room);
  const dup=Object.entries(ST.rake).find(([,r])=>r.personId===rf.pid&&r.room===rf.room&&r.month===ui.month);
  if(dup){const sum=Math.round(((+dup[1].rake||0)+(+rf.rake))*100)/100;if(await upd('rake',dup[0],{rake:sum}))toast('Добавлено к записи за месяц: теперь '+money(sum))}
  else if(await put('rake',uid(),{personId:rf.pid,month:ui.month,room:rf.room,nick:acc?.nick||'',rake:+rf.rake,deal:(acc&&acc.deal!==''&&acc.deal!=null)?+acc.deal:(+room.deal||0),payout:(acc&&acc.payout!==''&&acc.payout!=null)?+acc.payout:(+room.payout||0),paid:false,paidDate:'',createdAt:today()}))toast('Внесено');
  ui.rf={pid:rf.pid,room:'',rake:''};render();document.getElementById('rf-room')?.focus()}

function firstDealRoom(pid){const p=ST.people[pid];return (p?.accounts||[]).map(a=>a.room).find(r=>r&&ST.rooms[r]&&ST.rooms[r].active!==false)||''}

/* ---------- events ---------- */
function val(el){if(el.type==='checkbox')return el.checked;if(el.type==='number')return el.value===''?'':+el.value;return el.value}
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.f){setPath(draft,el.dataset.f,val(el));dirty=true;if(ui.closeAsk){ui.closeAsk=false;renderModal();return}if(el.dataset.re==='m')renderModal();return}
  if(el.dataset.tag){const t=el.dataset.tag;draft.tags=el.checked?[...new Set([...draft.tags,t])]:draft.tags.filter(x=>x!==t);
    if(el.checked&&t==='lead'&&!draft.lead)draft.lead={stage:'new',interest:'club'};if(el.checked&&t==='club'&&!draft.club)draft.club={access:'none'};dirty=true;renderModal();return}
  if(el.dataset.u){const v=el.type==='number'?el.value:val(el);setPath(ui,el.dataset.u,v);
    if(el.dataset.u==='pay.months'){const pr=+(draft.club?.price||PRICE);ui.pay.amount=String(Math.round(pr*+v*(1-DISC[+v])))}
    if(el.dataset.u==='rf.pid')ui.rf.room=firstDealRoom(v);
    if(el.dataset.re==='v')render();if(el.dataset.re==='m')renderModal()}});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.dataset.room){const k=el.dataset.k;let v=val(el);if((k==='deal'||k==='payout')&&v==='')v=0;await upd('rooms',el.dataset.room,{[k]:v});return}
  if(el.dataset.rake){await upd('rake',el.dataset.rake,{rake:el.value===''?0:+el.value});return}
  if(el.dataset.stage){e.stopPropagation();const st=el.value;await upd('people',el.dataset.stage,{lead:{stage:st}});return}});
document.addEventListener('click',async e=>{const st=e.target.closest('[data-stage]');if(st)return;
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;ui.confirm=null;render();window.scrollTo({top:0});return}
  const tw=e.target.closest('[data-tw]');if(tw){ui.tw=tw.dataset.tw;render();return}
  const r=e.target.closest('[data-role]');if(r){ui.role=r.dataset.role;render();return}
  const a=e.target.closest('[data-act]');
  if(!a){const o=e.target.closest('[data-open]');if(o&&ST.people[o.dataset.open])openPerson(o.dataset.open);return}
  const act=a.dataset.act,id=a.dataset.id,i=+a.dataset.i;
  const arm=async(key,fn)=>{if(ui.confirm===key){ui.confirm=null;await fn()}else ui.confirm=key;if(draft)renderModal();render()};
  switch(act){
    case 'new':newPerson();break;
    case 'close':closeModal(false);break;
    case 'discard':closeModal(true);break;
    case 'save':await saveDraft(!!a.dataset.close);break;
    case 'addAcc':(draft.accounts=draft.accounts||[]).push({room:'',nick:''});dirty=true;renderModal();break;
    case 'delAcc':draft.accounts.splice(i,1);dirty=true;renderModal();break;
    case 'addPlan':{draft.student=draft.student||{};const pl=draft.student.plan=draft.student.plan||[];const last=pl.length?pl[pl.length-1].month:'';pl.push({month:last?addMonths(last+'-01',1).slice(0,7):curMonth(),goal:'',done:false});dirty=true;renderModal();break}
    case 'delPlan':draft.student.plan.splice(i,1);dirty=true;renderModal();break;
    case 'addNote':{const tx=(ui.note||'').trim();if(!tx){toast('Напиши текст заметки');break}draft.student=draft.student||{};(draft.student.notes=draft.student.notes||[]).unshift({date:today(),text:tx});ui.note='';dirty=true;renderModal();break}
    case 'delNote':draft.student.notes.splice(i,1);dirty=true;renderModal();break;
    case 'addPay':await addPay();break;
    case 'delPay':await arm('pay'+id,async()=>{if(await del('payments',id))toast('Оплата удалена. Дату окончания доступа поправь вручную, если нужно.')});break;
    case 'delPerson':await arm('person',async()=>{if(await del('people',editId)){closeModal(true);toast('Карточка удалена')}});break;
    case 'addRake':await addRake();break;
    case 'delRake':await arm('rk'+id,async()=>{await del('rake',id)});break;
    case 'payGroup':{const rows=Object.entries(ST.rake).filter(([,r])=>r.personId===id&&r.month===ui.month);const rr=Object.entries(ST.rake).filter(([,r])=>r.month===ui.month&&rcalc(r).refPid===id);const all=rows.every(([,r])=>r.paid)&&rr.every(([,r])=>r.refPaid);
      for(const [rid] of rows)await upd('rake',rid,all?{paid:false,paidDate:''}:{paid:true,paidDate:today()});
      for(const [rid] of rr)await upd('rake',rid,all?{refPaid:false,refPaidDate:''}:{refPaid:true,refPaidDate:today()});if(!all)toast('Отмечено как выплачено');break}
    case 'addTask':{const tf=ui.tf;if(!(tf.title||'').trim()){toast('Напиши, что нужно сделать');break}if(await put('tasks',uid(),{title:tf.title.trim(),due:tf.due||'',personId:tf.pid||'',who:tf.who||'me',done:false,createdAt:today()})){ui.tf={title:'',due:'',pid:'',who:tf.who||'me'};render();toast('Задача добавлена')}break}
    case 'toggleTask':{const x=ST.tasks[id];if(x)await upd('tasks',id,{done:!x.done,doneDate:!x.done?today():''});break}
    case 'whoTask':{const x=ST.tasks[id];if(x){const w=(x.who||'me')==='helper'?'me':'helper';if(await upd('tasks',id,{who:w}))toast(w==='helper'?'Задача передана помощнику':'Задача теперь твоя')}break}
    case 'delTask':await arm('task'+id,async()=>{await del('tasks',id)});break;
    case 'showDone':ui.showDone=!ui.showDone;render();break;
    case 'payPerson':{const own=Object.entries(ST.rake).filter(([,r])=>r.personId===id&&!r.paid&&rcalc(r).out>0.004);const refs=Object.entries(ST.rake).filter(([,r])=>rcalc(r).refPid===id&&!r.refPaid);for(const [rid] of own)await upd('rake',rid,{paid:true,paidDate:today()});for(const [rid] of refs)await upd('rake',rid,{refPaid:true,refPaidDate:today()});toast('Отмечено: '+pname(id)+' — выплачено');break}
    case 'addExp':{const ef=ui.ef;if(!(+ef.amount>0)){toast('Укажи сумму');break}if(await put('expenses',uid(),{date:ef.date||today(),amount:+ef.amount,cat:(ef.cat||'Другое').trim(),biz:ef.biz,payeeName:(ef.payee||'').trim(),forp:ef.forp||'',note:(ef.note||'').trim(),rec:!!ef.rec,createdAt:today()})){ui.ef={...ef,amount:'',note:'',forp:'',rec:false};render();toast('Расход добавлен')}break}
    case 'payRec':{const e=ST.expenses[id];if(!e)break;const {createdAt,...rest}=e;if(await put('expenses',uid(),{...rest,date:today(),createdAt:today()})){await upd('expenses',id,{rec:false,recStopped:true});toast('Платёж записан в расходы')}break}
    case 'stopRec':{if(await upd('expenses',id,{rec:false}))toast('Больше не напоминаю об этом платеже');break}
    case 'delExp':await arm('exp'+id,async()=>{await del('expenses',id)});break;
    case 'partnerToggle':{const r=ST.rake[id];if(r)await upd('rake',id,{partnerUnpaid:!r.partnerUnpaid});break}
    case 'addRoom':{const rid=uid();await put('rooms',rid,{name:'Новый рум',deal:0,payout:0,basis:'netrev',active:true});setTimeout(()=>document.getElementById('rn-'+rid)?.select(),300);break}
    case 'delRoom':{if(Object.values(ST.rake).some(r=>r.room===id)){toast('По этому руму есть записи рейка — лучше снять галочку «Активен»');break}await arm('room'+id,async()=>{await del('rooms',id)});break}
  }});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeModal(false)});

/* ---------- boot ---------- */
/* Хранилище на сервере (Railway). Тот же интерфейс, что был у базы артефакта. */
function makeDb(){const subs={};let rev=-1,pulling=null;
  const fail=async r=>{if(r.status===401){location.href='/login';return}let m='';try{m=(await r.json()).error}catch(_){}const e=new Error(m||('HTTP '+r.status));e.code=r.status===403?'invalid_argument':'http';throw e};
  async function pull(){if(pulling)return pulling;pulling=(async()=>{try{const r=await fetch('/api/data',{credentials:'same-origin',cache:'no-store'});if(!r.ok)return fail(r);const j=await r.json();rev=j.rev;
    for(const c in subs){const docs=Object.entries(j.data[c]||{}).map(([id,d])=>({id,data:()=>d}));subs[c].forEach(([fn])=>fn({docs}))}}
    catch(e){for(const c in subs)subs[c].forEach(([,err])=>err&&err(e))}finally{pulling=null}})();return pulling}
  async function poll(){try{if(!document.hidden){const r=await fetch('/api/rev',{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.href='/login';return}if(r.ok){const j=await r.json();if(j.rev!==rev)await pull()}}}catch(_){}setTimeout(poll,4000)}
  async function write(op,col,id,data){const r=await fetch('/api/doc',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({op,col,id,data})});if(!r.ok)return fail(r);await pull()}
  let started=false;const start=()=>{if(started)return;started=true;setTimeout(async()=>{await pull();setTimeout(poll,4000)},0)};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
  return {collection(c){return {onSnapshot(fn,err){(subs[c]=subs[c]||[]).push([fn,err]);start()},doc(id){return {set:d=>write('set',c,id,d),update:d=>write('update',c,id,d),delete:()=>write('delete',c,id)}}}}}}
if(window.CRM_USER==='helper')ui.tw='helper';
render();
(()=>{db=makeDb();
  for(const c of ['people','payments','rake','rooms','tasks','expenses'])db.collection(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());ST[c]=o;loaded.add(c);render();
      if(draft&&(c==='payments'||c==='rake'||c==='rooms'))renderModal()},
    err=>{const b=document.getElementById('banner');b.hidden=false;b.textContent=errText(err)})})();
</script>
